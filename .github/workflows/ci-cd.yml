name: CI/CD Pipeline — Estuda Anne

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 1. Integração Contínua (CI): Instalação, Lint e Testes Automatizados
  test-and-lint:
    name: 🧪 Testes e Build (CI)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 📦 Configurar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: 🟢 Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📥 Instalar Dependências
        run: pnpm install --frozen-lockfile

      - name: 🧪 Executar Suíte de Testes Automatizados
        run: pnpm test

      - name: 🏗️ Executar Build de Validação do Monorepo
        run: pnpm build

  # 2. Entrega Contínua (CD): Deploy Automatizado na VPS via Docker
  deploy-to-vps:
    name: 🚀 Deploy na VPS (CD)
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 Executar Deploy Remoto via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 40m
          script_stop: true
          script: |
            set -eu
            echo "Starting deploy on VPS..."
            if [ -d /srv/estuda-anne ]; then
              APP_DIR="/srv/estuda-anne"
            elif [ -d /opt/estuda-anne ]; then
              APP_DIR="/opt/estuda-anne"
            else
              echo "ERROR: neither /srv/estuda-anne nor /opt/estuda-anne exists on VPS"
              exit 1
            fi
            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose down --remove-orphans
            docker rm -f estuda-anne-nginx 2>/dev/null || true
            docker compose up -d --build
            docker compose ps
            if [ -d /etc/nginx/conf.d ]; then
              if cp "$APP_DIR/nginx/host-vps-upload.conf" /etc/nginx/conf.d/estuda-anne-upload.conf; then
                nginx -t
                systemctl reload nginx || service nginx reload
                echo "Host nginx client_max_body_size set to 100m"
              else
                echo "WARN: could not write /etc/nginx/conf.d; host nginx may still 413 uploads"
              fi
            fi
            echo "Deploy completed successfully!"
