services:
  # Mongo local opcional (dev): docker compose --profile local-db up
  # Em produção o app usa só MONGODB_URI do .env (Atlas). Não subir este serviço.
  mongodb:
    image: mongo:7.0
    container_name: estuda-anne-mongo
    restart: always
    profiles:
      - local-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: estuda-anne
    volumes:
      - mongo_data:/data/db
    networks:
      - estuda-anne-network

  # Serviço de Autenticação & Usuários
  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: estuda-anne-auth
    restart: always
    ports:
      - "9005:3005"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_PORT=3005
    networks:
      - estuda-anne-network

  # Motor de Estudos (IA & Spaced Repetition)
  study-engine:
    build:
      context: .
      dockerfile: Dockerfile.study-engine
    container_name: estuda-anne-study-engine
    restart: always
    ports:
      - "9002:3002"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - STUDY_ENGINE_PORT=3002
    networks:
      - estuda-anne-network

  # Serviço de Métricas e Acompanhamento Evolutivo
  metrics:
    build:
      context: .
      dockerfile: Dockerfile.metrics
    container_name: estuda-anne-metrics
    restart: always
    ports:
      - "9004:3004"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - METRICS_SERVICE_PORT=3004
    networks:
      - estuda-anne-network

  # Backend For Frontend (BFF)
  bff:
    build:
      context: .
      dockerfile: Dockerfile.bff
    container_name: estuda-anne-bff
    restart: always
    ports:
      - "9001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - BFF_PORT=3001
      - AUTH_SERVICE_URL=http://auth:3005
      - STUDY_ENGINE_URL=http://study-engine:3002
      - METRICS_SERVICE_URL=http://metrics:3004
      - CORS_ORIGIN=${CORS_ORIGIN:-https://estuda-anne.singulartech.space}
    depends_on:
      - auth
      - study-engine
      - metrics
    networks:
      - estuda-anne-network

  # Frontend Web (Next.js)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_BFF_URL: ${NEXT_PUBLIC_BFF_URL:-https://estuda-anne.singulartech.space}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://estuda-anne.singulartech.space}
    container_name: estuda-anne-frontend
    restart: always
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-9000}
      - BFF_INTERNAL_URL=http://bff:3001
      - NEXT_PUBLIC_BFF_URL=${NEXT_PUBLIC_BFF_URL:-https://estuda-anne.singulartech.space}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://estuda-anne.singulartech.space}
    depends_on:
      - bff
    networks:
      - estuda-anne-network

  # Proxy interno. O host ja publica 80/443 (Cloudflare/nginx da VPS)
  # para frontend:9000 e bff:9001 — nao bindar porta no host.
  nginx:
    image: nginx:alpine
    container_name: estuda-anne-nginx
    restart: always
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    depends_on:
      - frontend
      - bff
    networks:
      - estuda-anne-network

volumes:
  mongo_data:
  certbot_etc:
  certbot_var:

networks:
  estuda-anne-network:
    driver: bridge
