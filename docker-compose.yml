version: '3.8'

services:
  # Banco de Dados MongoDB
  mongodb:
    image: mongo:7.0
    container_name: estuda-anne-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: estuda-anne
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - estuda-anne-network

  # Serviço de Autenticação & Usuários
  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: estuda-anne-auth
    restart: always
    ports:
      - "9005:3005"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_PORT=3005
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET:-secret_jwt_estuda_anne_key_2026}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@estuda-anne.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - estuda-anne-network

  # Motor de Estudos (IA & Spaced Repetition)
  study-engine:
    build:
      context: .
      dockerfile: Dockerfile.study-engine
    container_name: estuda-anne-study-engine
    restart: always
    ports:
      - "9002:3002"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - STUDY_ENGINE_PORT=3002
      - MONGODB_URI=${MONGODB_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_R2_ACCOUNT_ID}
      - CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME:-estuda-anne}
      - CLOUDFLARE_R2_ENDPOINT=${CLOUDFLARE_R2_ENDPOINT}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - estuda-anne-network

  # Backend For Frontend (BFF)
  bff:
    build:
      context: .
      dockerfile: Dockerfile.bff
    container_name: estuda-anne-bff
    restart: always
    ports:
      - "9001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - BFF_PORT=3001
      - AUTH_SERVICE_URL=http://auth:3005
      - STUDY_ENGINE_URL=http://study-engine:3002
      - CORS_ORIGIN=${CORS_ORIGIN:-https://estuda-anne.singulartech.space}
    depends_on:
      auth:
        condition: service_started
      study-engine:
        condition: service_healthy
    networks:
      - estuda-anne-network

  # Frontend Web (Next.js)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_BFF_URL: ${NEXT_PUBLIC_BFF_URL:-https://estuda-anne.singulartech.space}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://estuda-anne.singulartech.space}
    container_name: estuda-anne-frontend
    restart: always
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-9000}
      - BFF_INTERNAL_URL=http://bff:3001
      - NEXT_PUBLIC_BFF_URL=${NEXT_PUBLIC_BFF_URL:-https://estuda-anne.singulartech.space}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://estuda-anne.singulartech.space}
    depends_on:
      - bff
    networks:
      - estuda-anne-network

  # Proxy Reverso Nginx
  nginx:
    image: nginx:alpine
    container_name: estuda-anne-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    depends_on:
      - frontend
      - bff
    networks:
      - estuda-anne-network

volumes:
  mongo_data:
  certbot_etc:
  certbot_var:

networks:
  estuda-anne-network:
    driver: bridge
